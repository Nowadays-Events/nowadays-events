name: Collect and publish events
# Publishes the public event feed used by the Android application.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/publish-events.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: nowadays-events-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s agent -p "test_*.py" -v

      - name: Collect events
        env:
          OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
          HELLOASSO_CLIENT_ID: ${{ secrets.HELLOASSO_CLIENT_ID }}
          HELLOASSO_CLIENT_SECRET: ${{ secrets.HELLOASSO_CLIENT_SECRET }}
          EVENTBRITE_PRIVATE_TOKEN: ${{ secrets.EVENTBRITE_PRIVATE_TOKEN }}
          EVENTBRITE_ORGANIZATION_IDS: ${{ secrets.EVENTBRITE_ORGANIZATION_IDS }}
        run: python agent/nowadays_agent.py --max-pages 30 --max-runtime-seconds 180

      - name: Build public feed
        run: |
          mkdir -p _site
          cp agent/output/events.json _site/events.json
          cp agent/output/events.json _site/events
          cp agent/output/health.json _site/health.json
          cp agent/output/candidates.json _site/candidates.json
          printf '<!doctype html><html lang="fr"><meta charset="utf-8"><title>Nowadays Events API</title><body><h1>Nowadays Events API</h1><p><a href="events.json">Flux JSON des événements</a></p></body></html>\n' > _site/index.html
          touch _site/.nojekyll

      - name: Notify administrator about candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python agent/manage_reviews.py --candidates agent/output/candidates.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
