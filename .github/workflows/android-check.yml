name: Check Android application

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-check.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  pull_request:
    paths:
      - ".github/workflows/android-check.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:
    inputs:
      instrumented:
        description: "Execute device tests on an isolated Android emulator"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test and build application and instrumentation APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Upload APK for inspection
        uses: actions/upload-artifact@v6
        with:
          name: xymis-events-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload instrumentation APK for device validation
        uses: actions/upload-artifact@v6
        with:
          name: xymis-events-debug-androidTest-${{ github.run_number }}
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7

  device-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.instrumented
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download application APK from this validation
        uses: actions/download-artifact@v6
        with:
          name: xymis-events-debug-${{ github.run_number }}
          path: validation/app

      - name: Download instrumentation APK from this validation
        uses: actions/download-artifact@v6
        with:
          name: xymis-events-debug-androidTest-${{ github.run_number }}
          path: validation/tests

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute all instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            adb shell setprop persist.sys.timezone Europe/Paris
            adb install validation/app/app-debug.apk
            adb install validation/tests/app-debug-androidTest.apk
            adb shell am instrument -w com.nowadays.events.debug.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            adb logcat -d > instrumentation-logcat.txt
            grep -Eq '^OK \([0-9]+ tests?\)' instrumentation.txt

      - name: Preserve device test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xymis-device-tests-${{ github.run_number }}
          path: |
            instrumentation.txt
            instrumentation-logcat.txt
          retention-days: 14
