name: Publish test APK

on:
  push:
    tags:
      - "test-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare permanent Android signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -z "$SIGNING_KEY_BASE64" ]] && missing+=("ANDROID_SIGNING_KEY_BASE64")
          [[ -z "$SIGNING_STORE_PASSWORD" ]] && missing+=("ANDROID_SIGNING_STORE_PASSWORD")
          [[ -z "$SIGNING_KEY_ALIAS" ]] && missing+=("ANDROID_SIGNING_KEY_ALIAS")
          [[ -z "$SIGNING_KEY_PASSWORD" ]] && missing+=("ANDROID_SIGNING_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Secrets de signature manquants::Ajouter dans GitHub Actions : ${missing[*]}"
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/nowly-events-release.jks"
          echo "NOWLY_SIGNING_STORE_FILE=$RUNNER_TEMP/nowly-events-release.jks" >> "$GITHUB_ENV"
          echo "NOWLY_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NOWLY_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NOWLY_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run tests and build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Prepare downloadable files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/nowly-events-${GITHUB_REF_NAME}.apk
          cd release
          sha256sum nowly-events-${GITHUB_REF_NAME}.apk > nowly-events-${GITHUB_REF_NAME}.apk.sha256

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            'Version de test Android de Nowly Events.' \
            '' \
            'Installation : télécharger le fichier APK sur le téléphone, puis autoriser ponctuellement l’installation depuis le navigateur.' \
            '' \
            'Cette version est une préversion signée avec la clé permanente de Nowly Events.' \
            > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            release/*.apk release/*.sha256 \
            --verify-tag \
            --prerelease \
            --title "Nowly Events — test ${GITHUB_REF_NAME#test-v}" \
            --notes-file release-notes.md
