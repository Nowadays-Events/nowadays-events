name: Publish test APK

on:
  push:
    tags:
      - "test-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run tests and build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare downloadable files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/nowly-events-${GITHUB_REF_NAME}.apk
          cd release
          sha256sum nowly-events-${GITHUB_REF_NAME}.apk > nowly-events-${GITHUB_REF_NAME}.apk.sha256

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            'Version de test Android de Nowly Events.' \
            '' \
            'Installation : télécharger le fichier APK sur le téléphone, puis autoriser ponctuellement l’installation depuis le navigateur.' \
            '' \
            'Cette version est une préversion de démonstration signée avec la clé Android de développement.' \
            > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            release/*.apk release/*.sha256 \
            --verify-tag \
            --prerelease \
            --title "Nowly Events — test ${GITHUB_REF_NAME#test-v}" \
            --notes-file release-notes.md
